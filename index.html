<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRAGV - Monitoreo Bluetooth</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="dashboard">
        <header>
            <div class="title-container">
                <h1>SRAGV</h1>
                <p>Gestión de Viento Inteligente</p>
            </div>
            <div class="connection-status">
                <button id="connectBtn" class="btn-primary">
                    <span class="icon">🔌</span> Conectar HM-10
                </button>
            </div>
        </header>

        <div class="grid-container">
            <!-- Panel de Estado -->
            <section class="glass-card status-panel">
                <h2>Estado del Sistema</h2>
                <div class="mode-display">
                    <span id="currentMode" class="badge badge-offline">DESCONECTADO</span>
                </div>
            </section>

            <!-- Panel de Viento -->
            <section class="glass-card wind-panel">
                <h2>Lectura de Viento</h2>
                <div class="wind-info">
                    <div class="wind-speed">
                        <div class="circular-progress">
                            <svg viewBox="0 0 100 100">
                                <circle class="bg" cx="50" cy="50" r="45"></circle>
                                <circle class="meter" id="windMeter" cx="50" cy="50" r="45"></circle>
                            </svg>
                            <div class="value"><span id="windVal">0</span>%</div>
                        </div>
                        <span class="label">Velocidad</span>
                    </div>
                    <div class="wind-direction">
                        <div class="compass">
                            <div id="compassNeedle" class="needle"></div>
                            <span class="dir-n">N</span>
                            <span class="dir-s">S</span>
                            <span class="dir-e">E</span>
                            <span class="dir-o">O</span>
                        </div>
                        <span class="label">Dirección (<span id="windDirLabel">-</span>)</span>
                    </div>
                </div>
            </section>

            <!-- Panel de Riego (Sectores) -->
            <section class="glass-card irrigation-panel">
                <h2>Sectores de Riego</h2>
                <div class="sectors-grid">
                    <div class="sector" id="sec-n">
                        <div class="led"></div>
                        <span>Norte</span>
                    </div>
                    <div class="sector" id="sec-e">
                        <div class="led"></div>
                        <span>Este</span>
                    </div>
                    <div class="sector" id="sec-o">
                        <div class="led"></div>
                        <span>Oeste</span>
                    </div>
                    <div class="sector" id="sec-s">
                        <div class="led"></div>
                        <span>Sur</span>
                    </div>
                </div>
            </section>

            <!-- Panel de Configuración Remota -->
            <section class="glass-card config-panel">
                <h2>Ajustes de Riego (Bluetooth)</h2>
                
                <div class="config-group">
                    <div class="config-item">
                        <label>Viento Moderado (Alerta: <span id="valModTh">40</span>%)</label>
                        <input type="range" id="sliderModTh" min="0" max="100" step="5" value="40">
                    </div>
                    <div class="config-item">
                        <label>Viento Crítico (Corte total: <span id="valCriTh">80</span>%)</label>
                        <input type="range" id="sliderCriTh" min="0" max="100" step="5" value="80">
                    </div>
                    <div class="config-item">
                        <label>Duración de un ciclo de riego: <span id="valTim">60</span>s</label>
                        <input type="range" id="sliderTim" min="5" max="600" step="5" value="60">
                    </div>
                </div>

                <div class="switches-group">
                    <div class="switch-item">
                        <label>Riego Nocturno</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="chkNight">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <h3 class="sub-heading">Inhibición Manual (Apagar Zonas)</h3>
                <div class="switches-group inhibits-grid">
                    <div class="switch-item">
                        <label>Norte</label>
                        <label class="toggle-switch red">
                            <input type="checkbox" id="chkInhN">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="switch-item">
                        <label>Este</label>
                        <label class="toggle-switch red">
                            <input type="checkbox" id="chkInhE">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="switch-item">
                        <label>Sur</label>
                        <label class="toggle-switch red">
                            <input type="checkbox" id="chkInhS">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="switch-item">
                        <label>Oeste</label>
                        <label class="toggle-switch red">
                            <input type="checkbox" id="chkInhO">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
            </section>
        </div>
        
        <div id="debugLog" class="glass-card debug-panel hidden">
            <p id="debugText">Esperando conexión...</p>
        </div>
    </main>

    <script src="app.js?v=2"></script>
</body>
</html>
